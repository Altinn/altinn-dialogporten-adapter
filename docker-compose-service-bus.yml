name: "microsoft-azure-servicebus-emulator"
services:
  emulator:
    container_name: "servicebus-emulator"
    platform: linux/amd64
    image: "mcr.microsoft.com/azure-messaging/servicebus-emulator@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3"
    pull_policy: "always"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: "mssql"
      MSSQL_SA_PASSWORD: "password123456!"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 0
    depends_on:
      "mssql": { condition: service_healthy }
    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"
  mssql:
    container_name: "mssql"
    platform: linux/amd64
    image: "mcr.microsoft.com/mssql/server@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72"
    ports:
      - "1433:1433"
    networks:
      sb-emulator:
        aliases:
          - "mssql"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "password123456!"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'password123456!' -Q 'SELECT 1' -C || exit 1" ]
      interval: 5s
      timeout: 2s
      retries: 10

networks:
  sb-emulator:
